<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be Tech | Juegos</title>
    <link rel="stylesheet" href="estilos.css?v=21" />
  </head>
  <body class="home-body">
    <main class="home-shell">
      <div class="brand-bar">
        <a class="brand-mark" href="index.html" aria-label="Be Tech juegos">
          <span class="brand-spark" aria-hidden="true"></span>
          <span>Be Tech</span>
        </a>
        <span class="brand-tag">Juegos</span>
      </div>

      <section class="level-section" aria-label="Niveles disponibles">
        <div class="level-cards">
          <a class="level-card card-blue" href="etapas.html?nivel=4">
            <span class="card-emoji" aria-hidden="true">🧩</span>
            <strong>NIVEL 4</strong>
          </a>
          <a class="level-card card-cyan" href="nivel.html?nivel=5">
            <span class="card-emoji" aria-hidden="true">🚀</span>
            <strong>Nivel 5</strong>
          </a>
          <a class="level-card card-yellow" href="nivel.html?nivel=6">
            <span class="card-emoji" aria-hidden="true">⭐</span>
            <strong>Nivel 6</strong>
          </a>
          <a class="level-card card-pink" href="scratch-desafio.html?nivel=7">
            <span class="card-emoji" aria-hidden="true">🎲</span>
            <strong>Nivel 7</strong>
          </a>
          <a class="level-card card-blue" href="scratch-desafio.html?nivel=8">
            <span class="card-emoji" aria-hidden="true">💡</span>
            <strong>Nivel 8</strong>
          </a>
          <a class="level-card card-cyan" href="scratch-desafio.html?nivel=9">
            <span class="card-emoji" aria-hidden="true">🏆</span>
            <strong>Nivel 9</strong>
          </a>
          <a class="level-card card-yellow" href="scratch-desafio.html?nivel=10">
            <span class="card-emoji" aria-hidden="true">🔢</span>
            <strong>Nivel 10</strong>
          </a>
        </div>
      </section>

      <section style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 0 24px">
        <a class="gen-entry-btn" href="generador.html" aria-label="Ir al generador de niveles">
          <span aria-hidden="true">⚙️</span>
          <strong>Generador de Niveles</strong>
          <span class="gen-entry-sub">Crea y exporta tus propios desafíos</span>
        </a>
        <a class="gen-entry-btn" href="niveles.html" aria-label="Probar niveles generados">
          <span aria-hidden="true">🗂️</span>
          <strong>Niveles para Probar</strong>
          <span class="gen-entry-sub">Elegí y jugá niveles de la carpeta</span>
        </a>
        <a class="gen-entry-btn" href="niveles-ods.html" aria-label="Ir a niveles ODS">
          <span aria-hidden="true">ODS</span>
          <strong>Niveles ODS</strong>
          <span class="gen-entry-sub">Misiones de robotica y sustentabilidad</span>
        </a>
        <label class="gen-import-entry-btn" for="home-import-file" role="button" aria-label="Importar nivel desde archivo JSON">
          <span aria-hidden="true">📂</span>
          <strong>Importar y Jugar</strong>
          <span class="gen-entry-sub">Cargá un JSON y jugalo directo</span>
          <input id="home-import-file" type="file" accept=".json,application/json" style="display:none" />
        </label>
      </section>
    </main>

    <script src="home.js?v=3"></script>
