<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be Tech | Mision de bloques</title>
    <link rel="stylesheet" href="estilos.css?v=88" />
  </head>
  <body class="scratch-body">
    <main class="scratch-shell">
      <header class="scratch-topbar">
        <a class="back-link scratch-back" href="index.html" aria-label="Volver a niveles">
          <span class="side-control-icon" aria-hidden="true">&larr;</span>
          <span class="side-control-label">Volver</span>
        </a>

        <div class="scratch-heading">
          <p class="scratch-kicker" data-scratch-kicker>Nivel 7</p>
          <h1 data-scratch-title>Desafio Scratch</h1>
        </div>

        <a class="scratch-download" href="scratch/nano-starter.sb3" download>Proyecto Nano</a>
      </header>

      <section class="scratch-workbench scratch-mission-workbench" aria-label="Mision con bloques">
        <section class="scratch-mission-board">
          <div class="scratch-mission-dialog">
            <img class="scratch-nano-portrait" src="scratch/nano-scratch.png" alt="Nano" />
            <div>
              <span class="scratch-status">Mision</span>
              <h2 data-scratch-objective-title>Programa a Nano</h2>
              <p data-scratch-objective>
                Arma el camino con bloques para llevar a Nano hasta la estacion de carga.
              </p>
            </div>
          </div>

          <div class="scratch-map-wrap">
            <div class="scratch-map" data-scratch-grid aria-label="Mapa de la manta de Nano"></div>
          </div>

          <p class="scratch-run-message" data-scratch-message>Arrastra o toca bloques para armar el programa.</p>
        </section>

        <aside class="scratch-code-panel" aria-label="Programacion por bloques">
          <section class="scratch-panel-section">
            <div class="scratch-section-title">
              <span>1</span>
              <strong>Bloques</strong>
            </div>
            <div class="scratch-block-palette" data-scratch-palette></div>
          </section>

          <section class="scratch-panel-section scratch-program-section">
            <div class="scratch-section-title">
              <span>2</span>
              <strong>Programa</strong>
            </div>
            <div class="scratch-program-track" data-scratch-program></div>
          </section>

          <div class="scratch-controls">
            <button class="scratch-run" type="button" data-scratch-run>Ejecutar</button>
            <button class="scratch-reset" type="button" data-scratch-reset>Reiniciar</button>
          </div>

          <dl class="scratch-goal-list">
            <div>
              <dt>Concepto</dt>
              <dd data-scratch-concept>Secuencia</dd>
            </div>
            <div>
              <dt>Meta</dt>
              <dd data-scratch-deliverable>Nano llega al cargador sin pisar el charco.</dd>
            </div>
          </dl>
        </aside>
      </section>

      <nav class="scratch-level-nav" aria-label="Niveles Scratch">
        <a href="scratch-desafio.html?nivel=7" data-scratch-level-link="7">7</a>
        <a href="scratch-desafio.html?nivel=8" data-scratch-level-link="8">8</a>
        <a href="scratch-desafio.html?nivel=9" data-scratch-level-link="9">9</a>
        <a href="scratch-desafio.html?nivel=10" data-scratch-level-link="10">10</a>
      </nav>
    </main>

    <script src="scratch-desafio.js?v=2"></script>
  </body>
</html>
